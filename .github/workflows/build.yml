name: Build test APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleFossDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/foss/debug/*.apk Phone-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-apk
          path: Phone-test.apk

      # Each build on main replaces the APK on one "Latest test build" release,
      # so the newest build always has the same download link.
      - name: Publish latest test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test-build
          name: Latest test build
          prerelease: true
          body: "Test build ${{ github.run_number }} from ${{ github.sha }}. Download Phone-test.apk on your phone to install or update."
          files: Phone-test.apk
          overwrite_files: true
